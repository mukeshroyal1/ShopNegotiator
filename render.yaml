# Render Blueprint — Bargain Labs Django API (Shopify webhooks live here)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: bargainlabs-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_SCOPES
        value: write_draft_orders,write_inventory,read_inventory,read_locations,read_orders,write_orders,read_products,write_products
      - key: SHOPIFY_API_VERSION
        value: "2024-10"
      - key: SHOPIFY_REDIRECT_URI
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
